name: Build ARM64 chip-tool BlueZ retry

on:
  push:
    branches:
      - codex/bluez-connection-retry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Build patched ARM64 chip-tool
        run: ./build-chip-tool-bluez-retry.sh

      - name: Upload chip-tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: chip-tool-arm64-bluez-retry
          path: artifact/
          if-no-files-found: error
          retention-days: 14
